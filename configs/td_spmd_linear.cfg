# Linear-feature TD estimators inside KL-SPMD.
# Same budgets, grids, and seeds as td_spmd.cfg.
# The notebook reuses the feature-independent TOMC baseline from results/td_spmd/.
[tuning]
problems = Blackjack, GridWorld
methods = true_online_td, td_zero, td_lambda
baseline = baseline
tune_fraction = 0.1
tuning_seeds = 100, 101, 102
test_seeds = 200, 201, 202, 203, 204, 205, 206, 207, 208, 209, 210, 211, 212, 213, 214, 215, 216, 217, 218, 219
selection = exact_gap
z_threshold = 2.0
min_worse_diff = 0.001
certifier_rollouts = 20
certifier_start_rollouts = 2000
certifier_z = 3.0

[problem Blackjack]
environment = blackjack
budget = 120000

[problem GridWorld]
environment = gridworld
size = 10
budget = 20000000

[method true_online_td]
estimator = true_online_td
divergence = kl
spmd.step_size = 1.0, 10.0, 100.0
estimator.eta = 0.02, 0.1, 0.5
estimator.lam = 0.5, 0.8, 0.95
estimator.n_steps = 50000
estimator.features = linear

[method true_online_td @ Blackjack]
estimator.n_steps = 2000

[method td_zero]
estimator = td_zero
divergence = kl
spmd.step_size = 1.0, 10.0, 100.0
estimator.eta = 0.02, 0.1, 0.5
estimator.n_steps = 50000
estimator.features = linear

[method td_zero @ Blackjack]
estimator.n_steps = 2000

[method td_lambda]
estimator = td_lambda
divergence = kl
spmd.step_size = 1.0, 10.0, 100.0
estimator.eta = 0.02, 0.1, 0.5
estimator.lam = 0.5, 0.8, 0.95
estimator.n_steps = 50000
estimator.features = linear

[method td_lambda @ Blackjack]
estimator.n_steps = 2000

