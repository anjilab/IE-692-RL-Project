# Policy evaluation inside the same KL-SPMD loop (no entropy regularization):
# TOMC baseline vs TD(0), TD(lambda) and True Online TD(lambda), each with tabular and linear features.
# Linear = state aggregation (features.py): 2x2 cell blocks in GridWorld, grouped totals in Blackjack.
# SARSA(lambda) stays registered as estimator "sarsa_lambda" but is not in [tuning] methods, so it is not run.
# Run: python tune.py --config configs/td_compare.cfg --output results/td_compare
[tuning]
problems = Blackjack, GridWorld
methods = baseline, td_zero_tabular, td_zero_linear, td_lambda_tabular, td_lambda_linear, true_online_td_tabular, true_online_td_linear
baseline = baseline
tune_fraction = 0.1
tuning_seeds = 100, 101, 102
test_seeds = 200, 201, 202, 203, 204, 205, 206, 207, 208, 209, 210, 211, 212, 213, 214, 215, 216, 217, 218, 219
# Known-model values score held-out tuning runs; learners use only sampled transitions.
selection = exact_gap
z_threshold = 2.0
min_worse_diff = 0.001
certifier_rollouts = 20
certifier_start_rollouts = 2000
certifier_z = 3.0

[problem Blackjack]
environment = blackjack
budget = 120000

[problem GridWorld]
environment = gridworld
size = 10
budget = 20000000

# ----------------------------------------------------------------------------- baseline

[method baseline]
estimator = tomc
divergence = kl
spmd.step_size = 1.0, 10.0, 100.0
estimator.bias = 0.003, 0.01, 0.03

# ----------------------------------------------------------------------------- TD(0)

[method td_zero_tabular]
estimator = td_zero
divergence = kl
estimator.features = tabular
spmd.step_size = 1.0, 10.0, 100.0
estimator.eta = 0.02, 0.1, 0.5
estimator.n_steps = 50000

[method td_zero_tabular @ Blackjack]
estimator.n_steps = 2000

[method td_zero_linear]
estimator = td_zero
divergence = kl
estimator.features = linear
spmd.step_size = 1.0, 10.0, 100.0
estimator.eta = 0.02, 0.1, 0.5
estimator.n_steps = 50000

[method td_zero_linear @ Blackjack]
estimator.n_steps = 2000

# ----------------------------------------------------------------------------- TD(lambda), accumulated operators

[method td_lambda_tabular]
estimator = td_lambda
divergence = kl
estimator.features = tabular
spmd.step_size = 1.0, 10.0, 100.0
estimator.eta = 0.02, 0.1, 0.5
estimator.lam = 0.5, 0.8, 0.95
estimator.n_steps = 50000

[method td_lambda_tabular @ Blackjack]
estimator.n_steps = 2000

[method td_lambda_linear]
estimator = td_lambda
divergence = kl
estimator.features = linear
spmd.step_size = 1.0, 10.0, 100.0
estimator.eta = 0.02, 0.1, 0.5
estimator.lam = 0.5, 0.8, 0.95
estimator.n_steps = 50000

[method td_lambda_linear @ Blackjack]
estimator.n_steps = 2000

# ----------------------------------------------------------------------------- True Online TD(lambda)

[method true_online_td_tabular]
estimator = true_online_td
divergence = kl
estimator.features = tabular
spmd.step_size = 1.0, 10.0, 100.0
estimator.eta = 0.02, 0.1, 0.5
estimator.lam = 0.5, 0.8, 0.95
estimator.n_steps = 50000

[method true_online_td_tabular @ Blackjack]
estimator.n_steps = 2000

[method true_online_td_linear]
estimator = true_online_td
divergence = kl
estimator.features = linear
spmd.step_size = 1.0, 10.0, 100.0
estimator.eta = 0.02, 0.1, 0.5
estimator.lam = 0.5, 0.8, 0.95
estimator.n_steps = 50000

[method true_online_td_linear @ Blackjack]
estimator.n_steps = 2000
