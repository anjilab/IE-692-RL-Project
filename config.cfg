# Experiment settings for tune.py: the single config for every experiment (python tune.py runs all of
# them). Budgets are environment steps (observations).
# Costs: lower is better; gamma = 0.9 everywhere. Lists are comma-separated; a list is a grid axis.
#
# Every method is SPMD: a Q estimator (TOMC or a TD method) plus a Bregman-divergence policy step.
#   Bregman divergences   baseline (KL), bregman_euclidean, bregman_tsallis           TOMC estimator
#   Entropy-regularized   entropy_reg, entropy_reg_annealed                          TOMC + KL
#   Q estimators          true_online_td(_linear), td_zero_*, td_lambda_*            KL step
#   Estimator x step      td_euclidean, td_tsallis (vs true_online_td, which is KL)  True Online TD

[tuning]
# Following the project guideline: grid search over up to three parameters with three values each;
# every combination runs on tune_fraction of the full budget, averaged over tuning_seeds; the best
# one then runs on the full budget with test_seeds.
problems = GridWorld, Blackjack
methods = baseline, bregman_euclidean, bregman_tsallis, entropy_reg, entropy_reg_annealed,
          true_online_td, true_online_td_linear, td_zero_tabular, td_zero_linear,
          td_lambda_tabular, td_lambda_linear, td_euclidean, td_tsallis
baseline = baseline
tune_fraction = 0.1
tuning_seeds = 100, 101, 102
test_seeds = 200, 201, 202, 203, 204, 205, 206, 207, 208, 209, 210, 211, 212, 213, 214, 215, 216, 217, 218, 219
# Verdict vs baseline: better if z <= -z_threshold; worse if z >= z_threshold and the gap is at least
# min_worse_diff larger.
z_threshold = 2.0
min_worse_diff = 0.001
# How each method's combination is chosen: gap_lower (model-free: smallest mean certified lower bound on
# the optimality gap, ties broken by the upper bound) or exact_gap (smallest exact gap; uses the model).
selection = gap_lower
# Certifier for every run's final policy (validation rollouts, not charged to the budget):
# rollouts per (state, action), rollouts per pair and per policy at the start state, z-level.
certifier_rollouts = 20
certifier_start_rollouts = 2000
certifier_z = 3.0

[figures]
# One set of figures per group (at most eight methods each), written as <figure>_<problem>_<group>.png.
# The baseline comes first in every group, so it keeps the same color everywhere.
bregman = baseline, bregman_euclidean, bregman_tsallis
entropy = baseline, entropy_reg, entropy_reg_annealed
estimators = baseline, true_online_td, td_zero_tabular, td_lambda_tabular,
             true_online_td_linear, td_zero_linear, td_lambda_linear
td_bregman = baseline, true_online_td, td_euclidean, td_tsallis

# ----------------------------------------------------------------------------- problems
# label is the display name in figures (matplotlib mathtext allowed, e.g. $\lambda$). Keys other than
# environment, budget and label are passed to the environment constructor, except spmd.* keys, which
# override that SPMD parameter for every method on this problem.

[problem GridWorld]
label = GridWorld ($10 \times 10$)
# The handout's 10x10 grid. One TOMC estimate under the uniform policy takes 0.2M-1.4M steps, so the
# full budget is 20M (10% = 2M for tuning still fits at least one estimate).
environment = gridworld
size = 10
budget = 20000000

[problem Blackjack]
label = Blackjack
# About 700 steps per TOMC estimate.
environment = blackjack
budget = 120000

[problem Inventory]
label = Retail Inventory (M5)
# M5 FOODS_3_377 at store WI_1 (real-data bonus). Costs are in dollars, so step sizes are smaller.
# One TOMC estimate takes ~80k-110k steps.
environment = inventory
budget = 3000000
capacity = 12
unit_cost_fraction = 0.7
holding = 0.05
fixed_order = 1.0
weekly = true
start_stock = 0
start_weekday = 0
spmd.step_size = 0.1, 1.0, 10.0

# ----------------------------------------------------------------------------- methods
# estimator: tomc | true_online_td | td_zero | td_lambda | sarsa_lambda.  divergence: kl | euclidean |
# tsallis. TD estimators also take estimator.features = tabular (default) | linear.
# Parameters: spmd.step_size, spmd.tau, spmd.tau_power (annealed tau_k = tau / (k+1)^power),
# estimator.<field> and divergence.<field> (fields of the estimator / divergence classes).
# A section [method NAME @ PROBLEM] overrides keys of [method NAME] on that problem.
# label is the method's display name in figure legends (matplotlib mathtext allowed).

[method baseline]
label = KL (Baseline)
# The project baseline: TOMC + KL-SPMD.
estimator = tomc
divergence = kl
spmd.step_size = 1.0, 10.0, 100.0
estimator.bias = 0.01  # fixed: results/bias_sweep shows no reliable difference for 0.001-0.3

# ----------------------------------------------------------------------------- entropy-regularized SPMD (TOMC + KL)

[method entropy_reg]
label = Entropy-Regularized KL
estimator = tomc
divergence = kl
spmd.tau = 0.001, 0.01, 0.1
spmd.step_size = 1.0, 10.0, 100.0
estimator.bias = 0.01  # fixed: results/bias_sweep shows no reliable difference for 0.001-0.3

[method entropy_reg_annealed]
label = Annealed Entropy-Regularized KL
# tau_k = tau_0 / (k + 1), the schedule promised in the proposal.
estimator = tomc
divergence = kl
spmd.tau = 0.01, 0.1, 1.0
spmd.tau_power = 1.0
spmd.step_size = 1.0, 10.0, 100.0
estimator.bias = 0.01  # fixed: results/bias_sweep shows no reliable difference for 0.001-0.3

# ----------------------------------------------------------------------------- Bregman divergences (TOMC)

[method bregman_euclidean]
label = Euclidean
# Squared Euclidean divergence: the step is the projection of pi - eta Q onto the simplex.
estimator = tomc
divergence = euclidean
spmd.step_size = 0.5, 5.0, 50.0
estimator.bias = 0.01  # fixed: results/bias_sweep shows no reliable difference for 0.001-0.3

[method bregman_tsallis]
label = Tsallis
# Tsallis divergence; index 0.2314 is pg-termination's 1 / (1 - log(1 - gamma) / log 2) for gamma = 0.9.
# The useful step size depends strongly on the index (grad w ~ pi^(index - 1)), so both are tuned.
estimator = tomc
divergence = tsallis
spmd.step_size = 0.3, 3.0, 30.0
divergence.index = 0.2314, 0.5, 3.5
estimator.bias = 0.01

# ----------------------------------------------------------------------------- Q estimators (KL step)
# Every TD estimator starts from Q = 0 at each SPMD iteration (estimator.q_init, default 0) and uses
# n_steps fresh on-policy transitions per iteration. Linear = state aggregation (features.py): 2x2
# cell blocks in GridWorld, grouped totals in Blackjack. SARSA(lambda) stays registered as estimator
# "sarsa_lambda" but is not run.

[method true_online_td]
label = True Online TD($\lambda$)
# True Online TD(lambda) with tabular features; each SPMD iteration uses n_steps fresh transitions.
estimator = true_online_td
divergence = kl
spmd.step_size = 1.0, 10.0, 100.0
estimator.eta = 0.02, 0.1, 0.5
estimator.lam = 0.5, 0.8, 0.95
estimator.n_steps = 50000

[method true_online_td @ Blackjack]
estimator.n_steps = 2000

[method true_online_td @ Inventory]
estimator.n_steps = 20000

[method true_online_td_linear]
label = True Online TD($\lambda$), Linear
estimator = true_online_td
divergence = kl
estimator.features = linear
spmd.step_size = 1.0, 10.0, 100.0
estimator.eta = 0.02, 0.1, 0.5
estimator.lam = 0.5, 0.8, 0.95
estimator.n_steps = 50000

[method true_online_td_linear @ Blackjack]
estimator.n_steps = 2000

[method td_zero_tabular]
label = TD(0)
estimator = td_zero
divergence = kl
estimator.features = tabular
spmd.step_size = 1.0, 10.0, 100.0
estimator.eta = 0.02, 0.1, 0.5
estimator.n_steps = 50000

[method td_zero_tabular @ Blackjack]
estimator.n_steps = 2000

[method td_zero_linear]
label = TD(0), Linear
estimator = td_zero
divergence = kl
estimator.features = linear
spmd.step_size = 1.0, 10.0, 100.0
estimator.eta = 0.02, 0.1, 0.5
estimator.n_steps = 50000

[method td_zero_linear @ Blackjack]
estimator.n_steps = 2000

[method td_lambda_tabular]
label = TD($\lambda$)
# TD(lambda) with accumulated TD operators.
estimator = td_lambda
divergence = kl
estimator.features = tabular
spmd.step_size = 1.0, 10.0, 100.0
estimator.eta = 0.02, 0.1, 0.5
estimator.lam = 0.5, 0.8, 0.95
estimator.n_steps = 50000

[method td_lambda_tabular @ Blackjack]
estimator.n_steps = 2000

[method td_lambda_linear]
label = TD($\lambda$), Linear
estimator = td_lambda
divergence = kl
estimator.features = linear
spmd.step_size = 1.0, 10.0, 100.0
estimator.eta = 0.02, 0.1, 0.5
estimator.lam = 0.5, 0.8, 0.95
estimator.n_steps = 50000

[method td_lambda_linear @ Blackjack]
estimator.n_steps = 2000

# ----------------------------------------------------------------------------- True Online TD x divergence
# True Online TD(lambda) with the Euclidean and Tsallis steps; compare with true_online_td (KL). The TD
# step size and lambda are fixed at the values true_online_td selects (GridWorld 0.5 / 0.95, Blackjack
# 0.5 / 0.8), so the guideline's three-parameter limit leaves room for the step size and Tsallis index.
# The Q = 0 start matters here: unsampled actions look free (costs >= 0), and steps that can set an
# action's probability to exactly 0 (Euclidean, Tsallis index > 1) keep moving mass onto them.

[method td_euclidean]
label = True Online TD($\lambda$) + Euclidean
estimator = true_online_td
divergence = euclidean
spmd.step_size = 0.5, 5.0, 50.0
estimator.eta = 0.5
estimator.lam = 0.95
estimator.n_steps = 50000

[method td_euclidean @ Blackjack]
estimator.lam = 0.8
estimator.n_steps = 2000

[method td_tsallis]
label = True Online TD($\lambda$) + Tsallis
estimator = true_online_td
divergence = tsallis
spmd.step_size = 0.3, 3.0, 30.0
divergence.index = 0.2314, 0.5, 3.5
estimator.eta = 0.5
estimator.lam = 0.95
estimator.n_steps = 50000

[method td_tsallis @ Blackjack]
estimator.lam = 0.8
estimator.n_steps = 2000
