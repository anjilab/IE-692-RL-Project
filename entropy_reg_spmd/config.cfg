# Experiment settings for optimization.ipynb and tune.py (baseline SPMD vs Entropy-Regularized SPMD).
# Lists are comma-separated. Budgets are environment steps. Costs: lower is better; gamma = 0.9.

[experiment]
# Q estimator: the team's Truncated On-Policy Monte Carlo with dynamic exploration time (baseline.tomc).
# Each estimate starts a fresh on-policy stream and continues until every pair with
# pi(a|s) >= (1 - gamma) / |A| has been tried and the discounted tail after the last first visit is
# below bias. Q(s, a) is the return after the first visit; rarer pairs get the pessimistic cost
# 1 / (1 - gamma).
estimator = baseline.tomc
bias = 0.01
# Baseline: the team's KL-SPMD step (baseline.spmd) = entropy_reg_spmd with tau = 0.
# Entropy weights for Entropy-Regularized SPMD:
taus = 0.001, 0.01, 0.03, 0.1
# One step-size grid for every method (all use the same KL step).
step_sizes = 0.3, 1.0, 5.0, 20.0, 100.0
# Step sizes are tuned on these seeds (mean final gap), then each method is run on the test seeds.
tuning_seeds = 100, 101, 102
test_seeds = 200, 201, 202, 203, 204, 205, 206, 207, 208, 209, 210, 211, 212, 213, 214, 215, 216, 217, 218, 219
# Learning curves are recorded at this many evenly spaced fractions of the budget (0 to 1).
curve_points = 101
# Verdict vs baseline: better if z <= -2; worse if z >= 2 and the difference is at least min_worse_diff.
z_threshold = 2.0
min_worse_diff = 0.001

[GridWorld]
environment = grid_world_env.GridWorld
# one estimate under the uniform policy takes 0.2M-1.4M steps
budget = 3000000
# tune.py: tuning on 10% must fit at least one estimate, so it uses a larger full budget (10% = 2M)
tune_full_budget = 20000000

[Blackjack]
environment = blackjack_env.Blackjack
# about 700 steps per estimate
budget = 120000

[Inventory (M5)]
# tune.py only. FOODS_3_377 at store WI_1; costs in dollars, so its step sizes are tuned separately.
# Note: baseline.tomc assumes costs <= 1 for its pessimistic fill value 1 / (1 - gamma); inventory
# costs go up to about 15, so unvisited pairs are filled with 10, which is not an upper bound here.
environment = entropy_reg_spmd.inventory.RetailInventory.from_m5
budget = 1000000
# tune.py: one estimate takes ~80k-110k steps, so 10% of 3M (300k) allows a few updates
tune_full_budget = 3000000
tune_step_sizes = 1.0, 10.0, 100.0
data = data/m5_FOODS_3_377_WI_1.csv
capacity = 12
unit_cost_fraction = 0.7
holding = 0.05
fixed_order = 1.0
weekly = true
start_stock = 0
start_weekday = 0

[tuning]
# Hyperparameter tuning for tune.py, following the project guideline: grid search over up to three
# parameters with three values each; every combination runs on tune_fraction of the full budget
# (averaged over tuning_seeds), and the best one then runs on the full budget with test_seeds.
# The full budget is a problem's tune_full_budget if set, otherwise its budget.
#   baseline SPMD (KL, tau = 0)  step size x bias        (9 combinations)
#   Entropy-Reg SPMD             tau x step size x bias  (27 combinations)
# Inventory (M5) is skipped for now; add it back to this list to tune it.
problems = GridWorld, Blackjack
tune_fraction = 0.1
tuning_seeds = 100, 101, 102
test_seeds = 200, 201, 202, 203, 204, 205, 206, 207, 208, 209, 210, 211, 212, 213, 214, 215, 216, 217, 218, 219
taus = 0.001, 0.01, 0.1
biases = 0.003, 0.01, 0.03
step_sizes = 1.0, 10.0, 100.0
# problem sections can override the step sizes with tune_step_sizes
