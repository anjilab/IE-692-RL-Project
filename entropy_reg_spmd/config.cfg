# Experiment settings used by optimization.ipynb and tune.py (baseline SPMD vs Entropy-Regularized SPMD).
# Lists are comma-separated. Budgets are environment steps; horizon is the return length T. Costs: lower is better; gamma = 0.9.

[experiment]
# Q estimator: the team's Truncated On-Policy Monte Carlo with dynamic exploration time
# (utils.estimate_Q_online_mc_dynamic). One continuing on-policy stream; each update waits until every
# pair with pi(a|s) >= (1 - gamma) / |A| has been tried, then T - 1 more steps. Q(s, a) is the
# truncated return after the first visit; rarer pairs get the pessimistic cost 1 / (1 - gamma).
estimator = utils.estimate_Q_online_mc_dynamic
# entropy weights for Entropy-Regularized SPMD (0 = plain KL update)
taus = 0.0, 0.001, 0.01, 0.03, 0.1
# step sizes are tuned on these seeds (mean final gap), then each method is run on the test seeds
tuning_seeds = 100, 101, 102
test_seeds = 200, 201, 202, 203, 204, 205, 206, 207, 208, 209, 210, 211, 212, 213, 214, 215, 216, 217, 218, 219
# learning curves are recorded at this many evenly spaced fractions of the budget (0 to 1)
curve_points = 101
# verdict vs baseline: better if z <= -2; worse if z >= 2 and the difference is at least min_worse_diff
z_threshold = 2.0
min_worse_diff = 0.001

[step_sizes]
# default grids; problems below can override them
baseline = 0.1, 0.5, 2.0, 10.0, 50.0
pmd = 0.3, 1.0, 5.0, 20.0, 100.0

[GridWorld]
environment = baseline.GridWorld
coverage_rounds = 1
horizon = 70
budget = 1000000
# tune.py: one coverage round of the uniform policy takes ~530k steps, so tuning on 10% needs a
# larger full budget (10% = 1M steps, a few updates)
tune_full_budget = 10000000

[Blackjack]
environment = baseline_blackjack.Blackjack
coverage_rounds = 1
horizon = 3
budget = 120000

[Blackjack (2k)]
# the same game with a small budget (a few updates); larger step sizes
environment = baseline_blackjack.Blackjack
coverage_rounds = 1
horizon = 3
budget = 2000
baseline_step_sizes = 0.5, 2.0, 10.0, 50.0, 200.0
pmd_step_sizes = 5.0, 20.0, 100.0, 500.0, 2000.0

[Inventory (M5)]
# FOODS_3_377 at store WI_1; costs in dollars, so step-size grids are scaled down
environment = entropy_reg_spmd.inventory.RetailInventory.from_m5
coverage_rounds = 1
horizon = 40
budget = 1000000
# tune.py: one coverage round takes ~80k-110k steps, so 10% of 3M (300k) allows a few updates
tune_full_budget = 3000000
baseline_step_sizes = 0.01, 0.03, 0.1, 0.3, 1.0
pmd_step_sizes = 0.3, 1.0, 3.0, 10.0, 30.0
data = data/m5_FOODS_3_377_WI_1.csv
capacity = 12
unit_cost_fraction = 0.7
holding = 0.05
fixed_order = 1.0
weekly = true
start_stock = 0
start_weekday = 0
tune_baseline_step_sizes = 0.03, 0.3, 3.0
tune_pmd_step_sizes = 1.0, 10.0, 100.0

[tuning]
# Hyperparameter tuning for tune.py, following the project guideline: grid search over up to three
# parameters with three values each; every combination runs on tune_fraction of the full budget
# (averaged over tuning_seeds), and the best one then runs on the full budget with test_seeds.
# The full budget is a problem's tune_full_budget if set, otherwise its budget.
#   baseline SPMD         step size x coverage rounds        (9 combinations)
#   PMD, tau=0 (plain KL) step size x coverage rounds        (9 combinations)
#   Entropy-Reg SPMD      tau x step size x coverage rounds  (27 combinations)
# The return length T stays at each problem's horizon.
problems = GridWorld, Blackjack, Inventory (M5)
tune_fraction = 0.1
tuning_seeds = 100, 101, 102
test_seeds = 200, 201, 202, 203, 204, 205, 206, 207, 208, 209, 210, 211, 212, 213, 214, 215, 216, 217, 218, 219
taus = 0.001, 0.01, 0.1
coverage_rounds = 1, 2, 4
baseline_step_sizes = 0.5, 5.0, 50.0
pmd_step_sizes = 1.0, 10.0, 100.0
# problem sections can override the step sizes with tune_baseline_step_sizes / tune_pmd_step_sizes
